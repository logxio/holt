[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "holt-audit"
version = "0.1.0"
description = "Homology Learn-then-Test audits of protein function benchmarks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
]

[project.scripts]
holt = "holt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holt = ["protocol.json"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
embeddings = ["torch>=2.1,<3", "transformers>=4.57,<5", "esm>=3.4,<4"]

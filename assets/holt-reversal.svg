<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  @keyframes pulseGlow { 0%,100% { opacity: .16; } 50% { opacity: .48; } }
  @keyframes flowDash { to { stroke-dashoffset: -32; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  @keyframes scan { 0%,100% { transform: translateX(0); opacity:.2; } 50% { transform: translateX(118px); opacity:.8; } }
  @keyframes trace { from { stroke-dashoffset: 180; } to { stroke-dashoffset: 0; } }
  @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fillRing { from { stroke-dashoffset: 345.576; } }
  .glow { animation: pulseGlow 4s ease-in-out infinite; }
  .flow { stroke-dasharray: 4 12; animation: flowDash 2.4s linear infinite; }
  .breath { animation: breathe 3.6s ease-in-out infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  .trace { stroke-dasharray: 180; animation: trace 1.8s ease-out both; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: growBar 1.2s cubic-bezier(.2,.7,.3,1) both; }
  .ring { animation: fillRing 1.6s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .glow,.flow,.breath,.scan,.trace,.bar,.ring { animation: none; } }
</style>
